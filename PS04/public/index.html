<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <title>Find Closest Stadium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <script>
      async function findClosestStadium() {
        const city = document.getElementById("city").value;
        
        const response = await fetch('/api/get-closest-stadium', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ city }),
        });
        
        const data = await response.json();

        if (data.error) {
          document.getElementById("result").innerHTML = "Error: " + data.error;
        } else {
          // Display stadium information and image
          document.getElementById("result").innerHTML = 
            `City: ${data.city} <br>
             Latitude: ${data.latitude} <br>
             Longitude: ${data.longitude} <br>
             Closest Stadium: ${data.closestStadium} <br>
             Stadium City: ${data.stadiumCity} <br>
             Date: ${data.date} <br>
             Distance: ${data.distance} km <br>`;

          // Display the stadium image if available
          if (data.image_url) {
            document.getElementById("result").innerHTML += `<br><img src="${data.image_url}" alt="${data.closestStadium}" style="width: 400px;">`;
          }
        }
      }
    </script>
  </head>
  <body>
    <div class="container mt-5">
      <h1>Find the Closest Eras Tour Stadium</h1>
      <div class="mb-3">
        <label for="city" class="form-label">Enter your city:</label>
        <input type="text" class="form-control" id="city" placeholder="e.g. Boston">
      </div>
      <button class="btn btn-primary" onclick="findClosestStadium()">Find Closest Stadium</button>

      <div id="result" class="mt-5"></div>
    </div>
  </body>
</html>
