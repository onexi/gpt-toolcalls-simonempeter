<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Closest Stadium</title>
    <script>
        async function findClosestStadium() {
            const userMessage = document.getElementById("userInput").value;

            try {
                const response = await fetch("/api/openai-call", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ user_message: userMessage }),
                });

                if (!response.ok) {
                    throw new Error(`Error fetching stadium data: ${response.statusText}`);
                }

                const data = await response.json();
                document.getElementById("result").innerHTML = data.message;

                // Enable the second input once a stadium is found
                document.getElementById("reliveConcertInput").style.display = 'block';
            } catch (error) {
                console.error('Error occurred:', error);
                document.getElementById("result").innerHTML = `Error: ${error.message}`;
            }
        }

        async function reliveConcert() {
    const stadiumMessage = "Let me relive the concert in Gillette Stadium";
    try {
        const response = await fetch('/api/get-concert-weather', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ stadium_message: stadiumMessage }),
        });
        if (!response.ok) {
            throw new Error(`Error: ${response.statusText}`);
        }
        const data = await response.json();
        console.log('Concert weather:', data.message);
        // Display the message in the UI
        document.getElementById('result').innerHTML = data.message;
    } catch (error) {
        console.error('Error occurred:', error);
        document.getElementById('result').innerHTML = `Error: ${error.message}`;
    }
}

    </script>
</head>
<body>
    <h1>Find the Closest Stadium to You!</h1>
    <input type="text" id="userInput" placeholder="Enter your city (e.g., Boston)" />
    <button onclick="findClosestStadium()">Find Stadium</button>
    <br><br>
    <div id="result" style="white-space: pre-line;"></div>

    <!-- Input for reliving the concert -->
    <div id="reliveConcertInput" style="display:none;">
        <br>
        <input type="text" id="stadiumMessage" placeholder='Enter "Let me relive the concert in [stadium]"' />
        <button onclick="reliveConcert()">Relive Concert</button>
    </div>
    
    <br><br>
    <div id="weatherResult" style="white-space: pre-line;"></div> <!-- Display weather result -->
</body>
</html>
