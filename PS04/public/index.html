<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Closest Stadium</title>
    <script>
        async function findClosestStadium() {
            const userMessage = document.getElementById("userInput").value;

            try {
                const response = await fetch("/api/openai-call", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ user_message: userMessage }),
                });

                if (!response.ok) {
                    throw new Error(`Error fetching stadium data: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Raw response:', data);

                const resultMessage = data.message || "Could not find any stadium.";
                document.getElementById("result").innerHTML = resultMessage;
            } catch (error) {
                console.error('Error occurred:', error);
                document.getElementById("result").innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <h1>Find the Closest Stadium to You!</h1>
    <input type="text" id="userInput" placeholder="Find the closest stadium to Boston" />
    <button onclick="findClosestStadium()">Find Stadium</button>
    <br><br>
    <div id="result" style="white-space: pre-line;"></div>
</body>
</html>
