<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Closest Stadium or Relive the Concert</title>
    <script>
        async function handleUserInput() {
            const userMessage = document.getElementById("userInput").value;

            try {
                const response = await fetch("/api/openai-call", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ user_message: userMessage }),
                });

                if (!response.ok) {
                    throw new Error(`Error processing request: ${response.statusText}`);
                }

                const data = await response.json();
                document.getElementById("result").innerHTML = data.message;
            } catch (error) {
                console.error('Error occurred:', error);
                document.getElementById("result").innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <h1>Find the Closest Stadium or Relive a Taylor Swift Concert!</h1>
    <input type="text" id="userInput" placeholder="Enter your city or stadium name (e.g., Boston or Gillette Stadium)" />
    <button onclick="handleUserInput()">Submit</button>
    <br><br>
    <div id="result" style="white-space: pre-line;"></div>
</body>
</html>
